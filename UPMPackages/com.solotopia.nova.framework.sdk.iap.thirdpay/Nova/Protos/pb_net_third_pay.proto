// =====================================================================
// 应用内第三方支付
// =====================================================================
syntax = "proto3";

package NovaFramework.IAP.ThirdPay.Runtime;

option csharp_namespace = "NovaFramework.SDK.IAP.ThirdPay.Runtime";

import "pb_net_header.proto";

// =====================================================================
// 第三方支付配置
// post: "/v1/third_pay/payment_config"
// =====================================================================

// 第三方支付配置请求
message PbNetThirdPaymentConfigReq {
    NovaFramework.Runtime.PbNetReqHeader head = 1;  // 请求公共头
    string country = 2;                            // ISO 3166-1 alpha-2 国家或地区代码，例如 US
}

// 第三方支付配置响应
message PbNetThirdPaymentConfigResp {
    NovaFramework.Runtime.PbNetRespHeader head = 1;              // 响应公共头
    PbNetThirdPayAvailability availability = 2;                  // 当前用户是否允许发起第三方支付
    PbNetThirdProductConfig product_config = 3;                  // 当前国家可购买的商品配置
    PbNetThirdChannelConfig channel_config = 4;                  // 支付页需要透传的渠道参数
    PbNetThirdPaymentPageConfig payment_page_config = 5;         // 支付页入口配置
}

// 当前用户的第三方支付可用性
message PbNetThirdPayAvailability {
    bool enabled = 1;                                            // 是否允许发起新的第三方支付
    int32 disabled_reason = 2;                                   // 禁用原因；具体枚举值由服务端协议后续约定
}

// 第三方支付商品配置
message PbNetThirdProductConfig {
    repeated PbNetThirdProductInfo product_list = 1;
}

// 第三方支付渠道参数配置
message PbNetThirdChannelConfig {
    string payment_customer_ids = 1;
}

// 第三方支付页面配置
message PbNetThirdPaymentPageConfig {
    string payment_page_url = 1;                                 // 支付页 HTTPS 绝对地址
}

// 商品信息
message PbNetThirdProductInfo {
    int32 id = 1;                 // 商品自增 ID
    string local_currency = 2;    // 本地币种
    string local_price = 3;       // 本地价格
    string product_id = 4;        // 商品唯一 ID
}

// =====================================================================
// 查询支付成功但尚未校验的订单
// post: "/v1/third_pay/query_pending_order"
// =====================================================================

// 未校验订单查询请求
message PbNetThirdQueryPendingOrderReq {
    NovaFramework.Runtime.PbNetReqHeader head = 1;  // 请求公共头，包含应用 ID 和用户 ID
}

// 未校验订单查询响应
message PbNetThirdQueryPendingOrderResp {
    NovaFramework.Runtime.PbNetRespHeader head = 1;              // 响应公共头
    repeated PbNetThirdQueryPendingOrderInfo order_list = 2;     // 支付成功但尚未校验的订单
}

// 单笔未校验订单
message PbNetThirdQueryPendingOrderInfo {
    string client_order_id = 1;  // 客户端订单号
    int64 table_id = 2;          // 商品配置表 ID
}

// =====================================================================
// 第三方支付验单
// post: "/v1/third_pay/verify_iap"
// =====================================================================

// 验单请求
message PbNetThirdVerifyIapReq {
    NovaFramework.Runtime.PbNetReqHeader head = 1;  // 请求公共头
    repeated string client_order_ids = 2;           // 客户端订单号列表
}

// 验单响应
message PbNetThirdVerifyIapResp {
    NovaFramework.Runtime.PbNetRespHeader head = 1;        // 响应公共头
    repeated PbNetThirdVerifyOrderResult order_list = 2;   // 验单结果列表
}

// 第三方支付验单订单状态
enum PbNetThirdVerifyOrderStatus {
    PB_NET_THIRD_VERIFY_ORDER_STATUS_UNSPECIFIED       = 0;  // 未指定
    PB_NET_THIRD_VERIFY_ORDER_STATUS_PENDING_PAYMENT   = 1;  // 待支付
    PB_NET_THIRD_VERIFY_ORDER_STATUS_PROCESSING        = 2;  // 支付中
    PB_NET_THIRD_VERIFY_ORDER_STATUS_PAID              = 3;  // 支付成功
    PB_NET_THIRD_VERIFY_ORDER_STATUS_FAILED_OR_EXPIRED = 4;  // 支付失败或过期
    PB_NET_THIRD_VERIFY_ORDER_STATUS_DELIVERED         = 5;  // 已发货
    PB_NET_THIRD_VERIFY_ORDER_STATUS_NOT_FOUND         = 6;  // 订单不存在
}

// 单笔验单结果
message PbNetThirdVerifyOrderResult {
    string server_order_id = 1;                 // 服务端订单号
    PbNetThirdVerifyOrderStatus status = 2;     // 订单状态
    string receipt_param = 3;                   // 票据透传参数，对应 IAPResult.ReceiptParam
    int64 table_id = 4;                         // 商品配置表 ID
    string client_order_id = 5;                 // 客户端订单号
}
