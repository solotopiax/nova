// =====================================================================
// 应用内第三方支付
// =====================================================================
syntax = "proto3";

package NovaFramework.IAP.ThirdPay.Runtime;

option csharp_namespace = "NovaFramework.SDK.IAP.ThirdPay.Runtime";

import "pb_net_header.proto";

// =====================================================================
// 第三方支付商品列表
// post: "/third_pay/product_list"
// =====================================================================

// 商品列表请求
message PbNetThirdProductListReq {
    NovaFramework.Runtime.PbNetReqHeader head = 1;  // 请求公共头
    string country = 2;                            // 国家编码，例如 US
}

// 商品列表响应
message PbNetThirdProductListResp {
    NovaFramework.Runtime.PbNetRespHeader head = 1;          // 响应公共头
    repeated PbNetThirdProductInfo product_list = 2;         // 商品列表
}

// 商品信息
message PbNetThirdProductInfo {
    int32 id = 1;                 // 商品自增 ID
    string local_currency = 2;    // 本地币种
    string local_price = 3;       // 本地价格
    string product_id = 4;        // 商品唯一 ID
}

// =====================================================================
// 查询支付成功但尚未校验的订单
// post: "/third_pay/query_pending_order"
// =====================================================================

// 未校验订单查询请求
message PbNetThirdQueryPendingOrderReq {
    NovaFramework.Runtime.PbNetReqHeader head = 1;  // 请求公共头，包含应用 ID 和用户 ID
}

// 未校验订单查询响应
message PbNetThirdQueryPendingOrderResp {
    NovaFramework.Runtime.PbNetRespHeader head = 1;              // 响应公共头
    repeated PbNetThirdQueryPendingOrderInfo order_list = 2;     // 支付成功但尚未校验的订单
}

// 单笔未校验订单
message PbNetThirdQueryPendingOrderInfo {
    string client_order_id = 1;  // 客户端订单号
    int64 table_id = 2;          // 商品配置表 ID
}

// =====================================================================
// 查询第三方支付渠道参数
// post: "/third_pay/get_payment_customer_ids"
// =====================================================================

// 渠道参数查询请求
message PbNetThirdPayChannelParamsReq {
    NovaFramework.Runtime.PbNetReqHeader head = 1;  // 请求公共头，包含应用 ID 和用户 ID
}

// 渠道参数查询响应
message PbNetThirdPayChannelParamsResp {
    NovaFramework.Runtime.PbNetRespHeader head = 1;  // 响应公共头
    string payment_customer_ids = 2;                 // 部分渠道要求透传的 CID 等参数
}

// =====================================================================
// 第三方支付验单
// post: "/third_pay/verify_iap"
// =====================================================================

// 验单请求
message PbNetThirdVerifyIapReq {
    NovaFramework.Runtime.PbNetReqHeader head = 1;  // 请求公共头
    repeated string client_order_ids = 2;           // 客户端订单号列表
}

// 验单响应
message PbNetThirdVerifyIapResp {
    NovaFramework.Runtime.PbNetRespHeader head = 1;        // 响应公共头
    repeated PbNetThirdVerifyOrderResult order_list = 2;   // 验单结果列表
}

// 单笔验单结果
message PbNetThirdVerifyOrderResult {
    string server_order_id = 1;  // 服务端订单号
    int32 status = 2;            // 1=待支付 2=支付中 3=支付成功 4=支付失败/过期 5=已发货 6=订单不存在
    string receipt_param = 3;    // 票据透传参数，对应 IAPResult.ReceiptParam
    int64 table_id = 4;          // 商品配置表 ID
    string client_order_id = 5;  // 客户端订单号
}
